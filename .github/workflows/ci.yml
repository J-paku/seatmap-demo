# push / PR ごとに検査を走らせる。どれか1つでも落ちたら赤にする門で、すべて通ったものだけを信頼する。
# 型・Lint・形式・単体テスト・変異テスト・ビルド・E2E・Lighthouse は1ジョブに直列で置く
# (前段が落ちたら後段を走らせる意味が無いため。ビルドが無ければ E2E と Lighthouse は測る物が無い)。
# 未使用検出(knip)は独立ジョブにする — 実装途中の未配線モジュールで赤くなる時期があり、
# それで型やビルドの結果まで隠れると検査全体が見られなくなる。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへ連続 push したときは最新だけ検査する
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # 対象の glob の正本は package.json の format:check
      - name: Format check
        run: npm run format:check
      # 単体テストを全部走らせ、全体が床を下回るか、純粋モジュールが1ファイルでも100%を割ったらここで止まる
      # (基準の正本は vitest.config.ts の coverage.thresholds、ファイル別の対象は scripts/gate-targets.mjs)
      - name: Test with coverage
        run: npm run test:coverage
      # hooks/ 配下の単体テストと renderHook の混入を落とす
      - name: Test boundary
        run: npm run test:boundary
      # 変異テストは前回の結果(stryker.config.mjs の incrementalFile)を引き継ぎ、変わった変異体だけを走らせる。
      # 鍵に依存・設定の指紋を入れ、どれかが変わると引き継がずに全部を走らせる
      # (incremental は mutate のファイルとテストしか比べず、依存・設定だけの変更では前回の結果を使い回すため)。
      # キャッシュがまだ無い最初の push では、引き継ぐ結果が無いので全部が走る
      - name: Restore Stryker incremental result
        uses: actions/cache/restore@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts') }}-${{ github.sha }}
          restore-keys: stryker-incremental-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts') }}-
      - name: Mutation test
        run: npm run test:mutation
      # 変異テストが落ちても結果は残して次の push を速くする。取り消された実行は保存しない
      - name: Save Stryker incremental result
        if: ${{ !cancelled() && hashFiles('reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.config.ts') }}-${{ github.sha }}
      # 計測(GoatCounter)の URL は渡さない。CI のビルドに計測タグを載せず、E2E・Lighthouse の配信で数えさせない。
      # GITHUB_PAGES も渡さない(basePath 無しの out/ を :4173 の直下で配る)
      - name: Build
        run: npm run build
      # ブラウザ本体は lock ファイルの版ごとに使い回す。OS 側の依存はキャッシュできないので hit でも入れる
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # 配信は playwright.config.ts の webServer が out/ を :4173 で上げ、終われば止める
      - name: E2E
        run: npm run test:e2e
      # E2E の配信は止まっているので、Lighthouse 用に :4173 で上げ直す
      - name: Start static server
        run: npx serve out -l 4173 &
      # 上がらないまま待ち続けないよう、待つのは2分まで
      - name: Wait for static server
        timeout-minutes: 2
        run: npx -y wait-on http://localhost:4173
      # 測る先は前段が :4173 で上げた配信(経路と基準の正本は lighthouserc.json)。
      # 基準の根拠は docs/quality/performance.md。報告は外へ上げない(upload を設定しない)
      - name: Lighthouse CI
        run: npx -y @lhci/cli@0.15.1 collect && npx -y @lhci/cli@0.15.1 assert

  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Knip
        run: npm run knip
