# main への push を検査した ci が緑になったときだけ、ci が検査したそのコミットで静的 export をビルドし、
# gh-pages ブランチへ配信する。push を直接の引き金にすると ci の結果を待たずに配信され、検査に落ちた
# コミットも公開されるので、ci の完了(workflow_run)を引き金にする。
# 手で配り直す(workflow_dispatch)ときは ci の結果を見ず、選んだブランチの最新コミットを配信する。
# Pages の配信元は gh-pages ブランチ(legacy build)なので、成果物をそこへ載せ替える。
# basePath はプロジェクトサイト配信のときだけ必要なので GITHUB_PAGES=true で有効化する。
name: deploy-pages

on:
  # workflows にはファイル名ではなく ci.yml の name: を書く。branches は ci が走ったブランチ(head_branch)で絞る
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 既定のワークフロー権限が read のため、gh-pages へ push する分だけ明示的に足す
permissions:
  contents: write

# 連続 push 時は最新のコミットだけ配信する(古い配信で上書きしない)
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    # ci が成功し、かつその ci が push で走ったときだけ配信する。失敗・取り消し・pull_request・手動の ci では配信しない
    # (pull_request の ci はフォークの main 由来でも head_branch が main になるので、branches の絞り込みだけに頼らない)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # 配信するコミット。workflow_run では github.sha が既定ブランチの最新になり、ci が検査したコミットとずれうるので
    # ci の head_sha を使う。手で配り直すときは workflow_run が無いので、選んだブランチの最新(github.sha)になる
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: npm run build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      # .git 以外を消してから丸ごと置き直す。rsync は使わない —
      # サイズ+mtime のクイックチェックで、名前が固定でサイズも変わらない HTML の転送を
      # 飛ばすことがある(chunk 名は content-hash で13文字固定なので index.html のバイト数が
      # 毎ビルド同じになる)。実際に 2026-08-08 の配信で HTML だけ前世代のまま残り、
      # 参照先の css/js が消えて配信が丸ごと 404 になった。
      # .nojekyll が無いと _next/ 配下(先頭アンダースコア)が Jekyll に無視されて 404 になる
      - name: Sync artifacts
        run: |
          find .gh-pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a out/. .gh-pages/
          touch .gh-pages/.nojekyll

      # push する前に、HTML の参照先が同じツリーに実在するかを確認する。
      # 上の壊れ方はワークフローが全て緑のまま起きたので、配信物そのものを見る検査を挟む
      - name: Verify artifacts
        run: bash scripts/verify-deploy-artifacts.sh .gh-pages /seatmap-demo

      - name: Commit and push
        working-directory: .gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '配信物に差分なし。何も push しない'
            exit 0
          fi
          git commit -m "deploy: ${DEPLOY_SHA::7} をビルドして配信する"
          git push
